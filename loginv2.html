<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Sign In</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --color-primary-500: #ff0000;
        --color-link-500: #0369a1;

        --color-neutral-0: #ffffff;
        --color-neutral-50: #eeeeee;
        --color-neutral-100: #d5d6d4;
        --color-neutral-300: #a9acab;
        --color-neutral-500: #6c7273;
        --color-neutral-900: #101820;
        --color-neutral-400: #e0e1e0;
        --color-neutral-800: #525252;
        --color-black: #000000;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        font-family: "Inter", sans-serif !important;
        height: 100%;
        background: var(--color-neutral-50);
      }

      /* =========================================================
           LAYOUT
        ========================================================= */

      .page {
        min-height: 100vh;
        display: flex;
      }

      /* =========================================================
           LEFT PANEL
        ========================================================= */

      .left {
        flex: 0.6;
        position: relative;
        overflow: hidden;

        background-image: url("https://daeda-panel-frontend-ten.vercel.app/Login_left.png");
        background-size: cover;
        background-position: center;

        border-top-left-radius: 24px;
        border-bottom-left-radius: 24px;
      }

      .left::before {
        content: "";
        position: absolute;
        inset: 0;

        background: rgba(0, 0, 0, 0.12);
      }

      .left::after {
        content: "";
        position: absolute;
        inset: 0;

        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.5) 0%,
          rgba(0, 0, 0, 0) 50%,
          #000000 100%
        );
      }

      .left-top,
      .left-bottom {
        position: absolute;
        z-index: 2;

        left: 40px;
        right: 40px;
      }

      .left-top {
        top: 28px;
      }

      .left-logo {
        height: 40px;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      }

      .left-bottom {
        bottom: 42px;
        color: white;
      }

      .left-bottom h2 {
        font-family: "Work Sans", sans-serif !important;
        font-size: 36px;
        font-weight: 600;
        line-height: 36px;
        letter-spacing: -1px;
        margin-bottom: 12px;

        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      }

      .left-bottom p {
        font-size: 18px;
        line-height: 28px;
        letter-spacing: 0px;
        color: rgba(255, 255, 255, 0.88);

        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      }

      /* =========================================================
           RIGHT PANEL
        ========================================================= */

      .right {
        flex: 1;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login_form {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 460px;

        padding: 40px 32px;

        border-radius: 24px;

        background: var(--color-neutral-0);
      }

      .header_form {
        text-align: center;
        margin-bottom: 32px;
      }

      h1 {
        font-family: "Work Sans", sans-serif !important;
        font-size: 28px;
        font-weight: 600;
        font-style: semibold;
        line-height: 28px;
        letter-spacing: -1px;
        color: var(--color-neutral-900);
      }

      .subtitle {
        font-size: 16px;
        font-weight: 500;
        font-style: medium;
        line-height: 24px;
        letter-spacing: 0px;
        color: var(--color-neutral-500);
        margin-top: 6px;
      }

      .lock-container-panel {
        display: flex !important;
        flex-direction: column !important;
        margin-top: 16px !important;
      }

      /* =========================================================
           AUTH0 LOCK BASE OVERRIDES
        ========================================================= */

      .auth0-lock.auth0-lock * {
        font-family: inherit !important;
      }

      .auth0-lock-center {
        padding: 0 !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-header {
        display: none !important;
      }

      /* =========================================================
   FORCE AUTH0 LOCK TO MATCH FORM WIDTH
========================================================= */

      /* Lock main container must respect parent width */
      #lock-container {
        width: 100% !important;
      }

      /* Lock widget must not overflow form */
      .auth0-lock.auth0-lock {
        width: 100% !important;
        max-width: 100% !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-center {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-widget {
        width: 100% !important;
        max-width: 100% !important;
      }

      /* Hide Auth0 tabs immediately (no flash) */
      .auth0-lock.auth0-lock .auth0-lock-tabs-container {
        display: none !important;
      }

      /* Show tabs only when ready */
      .lock-ready .auth0-lock.auth0-lock .auth0-lock-tabs-container {
        display: flex !important;
      }

      /* Tabs container must follow same width */
      .auth0-lock.auth0-lock .auth0-lock-tabs-container {
        width: 100% !important;
      }

      /* Tabs must respect parent width */
      .auth0-lock.auth0-lock .auth0-lock-tabs {
        width: 100% !important;
        max-width: 100% !important;
      }

      /* Ensure form itself matches tabs width */
      .auth0-lock.auth0-lock .auth0-lock-form {
        width: 100% !important;
        max-width: 100% !important;
      }

      /* =========================================================
           AUTH0 LOCK TABS (SEGMENTED CONTROL)
        ========================================================= */

      .auth0-lock.auth0-lock .auth0-lock-tabs-container {
        font-family: "Inter", sans-serif !important;
        padding: 0 !important;
        margin-bottom: 35px !important;
        display: flex;
        justify-content: center;
        margin-left: 0px !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-tabs {
        width: 100% !important;
        background: var(--color-neutral-400) !important;
        border-radius: 24px !important;
        padding: 4px !important;
        height: 29px !important;
        color: var(--color-black) !important;
        box-shadow: none !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-tabs li {
        flex: 1 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0px !important;
        border-radius: 16px !important;
        height: 29px !important;
        transition: all 160ms ease !important;
        color: var(--color-black) !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-tabs li a,
      .auth0-lock.auth0-lock .auth0-lock-tabs li span {
        padding: 0px !important;
        font-size: 14px !important;
        font-weight: 600 !important;
        font-style: semibold !important;
        line-height: 20px !important;
        letter-spacing: 0.5% !important;
        transition: all 160ms ease !important;
        color: var(--color-black) !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-tabs li.auth0-lock-tabs-current {
        background: var(--color-neutral-0) !important;
        color: var(--color-black) !important;
        box-shadow: none !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-tabs li::after {
        display: none !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-form {
        padding: 0px !important;
      }

      /* =========================================================
           INPUTS
        ========================================================= */

      .auth0-lock.auth0-lock .auth0-lock-input-wrap {
        border-radius: 12px !important;
        background-color: var(--color-neutral-0) !important;
        border: 1px solid var(--color-neutral-400) !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-input-wrap .auth0-lock-input {
        border-radius: 12px !important;
        padding: 0px !important;
      }

      .auth0-lock.auth0-lock
        .auth0-lock-input-wrap
        .auth0-lock-input
        input::placeholder {
        color: var(--color-neutral-400) !important;
        font-size: 14px !important;
        font-weight: 400 !important;
        line-height: 20px !important;
        letter-spacing: 0.5% !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-input-wrap svg.auth0-lock-icon {
        display: none !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-input-email .auth0-lock-input-wrap {
        background-image: url("https://daeda-panel-frontend-ten.vercel.app/email.svg") !important;
        background-repeat: no-repeat;
        background-position: 14px center;
        background-size: 18px;

        padding-left: 44px !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-input-password .auth0-lock-input-wrap {
        background-image: url("https://daeda-panel-frontend-ten.vercel.app/lock.svg") !important;
        background-repeat: no-repeat;
        background-position: 14px center;
        background-size: 18px;

        padding-left: 44px !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-submit {
        background: var(--color-primary-500) !important;

        border-radius: 12px !important;

        padding: 0 !important;

        margin-top: 20px !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-submit svg {
        display: none !important;
      }

      .auth0-lock.auth0-lock .auth0-lock-submit:hover {
        background: #cc0000 !important;
      }

      .auth0-lock-alternative {
        text-align: right !important;
        padding: 0 !important;
        margin: 12px 0 !important;
        text-decoration: underline !important;
        color: var(--color-neutral-500) !important;
      }

      .auth0-lock-alternative a {
        font-size: 14px !important;
        font-weight: 500 !important;
        line-height: 20px !important;
        letter-spacing: 0.5% !important;
        color: var(--color-link-500) !important;
      }

      .auth0-lock-input-label {
        color: var(--color-black) !important;
        font-weight: 600 !important;
        font-style: normal !important;
        font-size: 12px !important;
        line-height: 20px !important;
        letter-spacing: 0.5% !important;
        text-transform: uppercase !important;
      }

      /* ================================
   Error message (Auth0 uses IDs)
=================================== */
      #auth0-lock-error-msg-email,
      #auth0-lock-error-msg-password {
        color: #ef4444 !important;
        font-size: 14px !important;
        font-weight: 400 !important;
        line-height: 20px !important;
        letter-spacing: 0.5% !important;
        margin-top: 6px !important;
      }

      /* ================================
   Input text + placeholder (when described by an error msg)
=================================== */
      .auth0-lock.auth0-lock input[aria-describedby*="auth0-lock-error-msg"] {
        color: #ef4444 !important;
      }

      .auth0-lock.auth0-lock
        input[aria-describedby*="auth0-lock-error-msg"]::placeholder {
        color: #ef4444 !important;
      }

      /* ================================
   Border and icon color (when described by an error msg)
=================================== */

      /* Modern browsers: border on wrapper */
      .auth0-lock.auth0-lock
        .auth0-lock-input-wrap:has(
          input[aria-describedby*="auth0-lock-error-msg"]
        ) {
        border: 1px solid #ef4444 !important;
      }

      /* Icon red (if icon SVG is inside same input wrap) */
      .auth0-lock.auth0-lock
        .auth0-lock-input-wrap:has(
          input[aria-describedby*="auth0-lock-error-msg"]
        )
        svg {
        fill: #ef4444 !important;
      }

      .auth0-lock-terms {
        display: none !important;
      }

      /*  Password validation */

      #password-rules {
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
        margin-bottom: 12px !important;
      }

      #password-rules > p {
        margin: 0px !important;
        text-align: left !important;
        font-size: 12px !important;
        line-height: 16px !important;
        letter-spacing: 1.5% !important;
        color: #6c7273 !important;
        display: flex !important;
        gap: 4px !important;
      }

      #password-rules svg path {
        fill: #6c7273;
      }

      #password-rules .valid svg path {
        fill: #059669 !important;
      }

      #password-rules .valid {
        color: #059669 !important;
      }

      /*  Confirm Password */
      .confirm-password-error {
        color: #ef4444 !important;
        font-size: 14px !important;
        display: none;
      }

      /* =========================================================
           RESPONSIVE
        ========================================================= */

      @media (max-width: 920px) {
        .left {
          display: none;
        }

        .right {
          padding: 24px;
        }

        .login_form {
          max-width: 100%;
        }
      }

      @media (max-width: 450px) {
        .left {
          display: none;
        }

        .right {
          padding: 24px;
        }

        .login_form {
          max-width: 100%;
        }

        .auth0-lock-tabs-container {
          margin-top: 0px !important;
        }

        .auth0-lock.auth0-lock .auth0-lock-cred-pane-internal-wrapper {
          height: 100% !important;
        }
      }

      /* =========================================================
      forgot password screen
      ========================================================*/

      #redirect-login {
        width: 100%;
        display: none;
        justify-content: center;
        align-items: center;
        background-color: var(--color-primary-500);
        color: white;
        border-radius: 12px;
        height: 40px;
        text-decoration: none;
      }

      .lock-container-panel.forgot-password-success {
        display: none !important;
      }

      .auth0-lock-password-strength {
        display: none !important;
      }

      .auth0-lock-password-strength::after {
        display: none !important;
      }

      .auth0-lock-show-password {
        margin-top: 20px !important;
      }

      .header-form-forgot-password {
        text-align: center;
        position: relative;
      }

      .forgot-password-back-arrow {
        position: absolute;
        left: 0;
        top: -8px;
        background: none;
        border: none;
        color: var(--color-primary-500);
        cursor: pointer;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.2s ease;
        z-index: 9999;
        pointer-events: auto;
      }

      .forgot-password-back-arrow svg {
        width: 32px;
        height: 32px;
        pointer-events: none;
      }

      .forgot-password-back-arrow:hover {
        opacity: 0.7;
      }

      .forgot-password-back-arrow:active {
        opacity: 0.5;
      }

      .password-set-successfully-bottom {
        min-height: 96px;
        padding: 16px 32px;
        align-items: center;
      }

      .go-back-login {
        background-color: var(--color-primary-500);
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        line-height: 16px;
        letter-spacing: 0;
        width: 100%;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 12px;
      }

      .auth0-loading-container {
        height: 100px !important;
      }

      .auth0-loading {
        margin-top: 20px !important;
        width: 48px !important;
        height: 48px !important;
        border-radius: 50% !important;
        border: none !important;
        background: conic-gradient(
          from 180deg at 50% 50%,
          #cc0600 0deg,
          #cc0600 63.24deg,
          rgba(255, 255, 255, 0) 360deg
        ) !important;

        animation: spin 1s linear infinite !important;

        mask: radial-gradient(
          farthest-side,
          transparent 70%,
          black 71%
        ) !important;
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent 70%,
          black 71%
        ) !important;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Permanently hide all Auth0 Lock global error messages */
      .auth0-global-message.auth0-global-message-error {
        display: none !important;
      }

      /* Prevent signup button from growing */
      .auth0-lock-submit {
        min-height: 40px !important;
        height: 40px !important;
      }

      /* Add spacing for error messages */
      .auth0-global-message {
        margin-bottom: 16px !important;
        margin-top: -16px !important;
        padding-top: 0px !important;
      }

      .auth0-lock-error-msg {
        margin-top: 4px !important;
        margin-bottom: 0px !important;
      }

      /* Ensure error messages don't overlap with inputs */
      .auth0-lock-input-block {
        margin-bottom: 12px !important;
      }

      /* Success message styling */
      .signup-success-message {
        background-color: #059669;
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        margin-top: -16px;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .signup-success-message svg {
        flex-shrink: 0;
      }

      .auth0-label-submit{
        text-transform: none !important;
      }

    </style>
  </head>

  <body>
    <div class="page">
      <div class="left">
        <div class="left-top">
          <img
            class="left-logo"
            src="https://daeda-panel-frontend-ten.vercel.app/Logo_Dark.png"
          />
        </div>

        <div class="left-bottom">
          <h2>
            Welcome to<br />
            DaedaPanel
          </h2>

          <p>Lorem ipsum dolor sit amet, consectetur</p>
        </div>
      </div>

      <div class="right">
        <div class="login_form">
          <div class="header_form">
            <h1>Log in to your account</h1>

            <p class="subtitle">Welcome back! Please enter your details</p>
          </div>
          <div class="header-form-forgot-password" style="display: none">
            <button
              id="forgot-password-back-btn"
              class="forgot-password-back-arrow"
              aria-label="Go back to login"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 18L9 12L15 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <h1>Forgot password?</h1>

            <p class="subtitle">
              Please enter your email address. We will send you a link to reset
              your password.
            </p>
          </div>

          <div class="lock-container-panel">
            <div id="lock-container"></div>
          </div>
          <div class="password-set-successfully-bottom" style="display: none">
            <a
              id="go-back-login-btn"
              href="https://{{ application.callback_domain }}/api/auth/login"
              class="go-back-login"
              >Go back to login</a
            >
          </div>
          <p class="auth-switch" id="auth-switch"></p>
        </div>
      </div>

      <!-- Hidden SVG templates (inline in code) -->
      <svg
        id="icon-email-error-template"
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="13"
        viewBox="0 0 32 26"
        style="display: none"
      >
        <path fill="#EF4444" d="M2 4h28v18H2z" />
      </svg>

      <svg
        id="icon-lock-error-template"
        xmlns="http://www.w3.org/2000/svg"
        width="15"
        height="18"
        viewBox="0 0 15 18"
        style="display: none"
      >
        <path
          fill="#EF4444"
          d="M7.08301 0C9.46463 0 11.3953 1.93092 11.3955 4.3125V5.74512C12.7382 6.11763 13.7581 7.27793 13.9482 8.68945C14.0658 9.56263 14.167 10.4865 14.167 11.4375C14.167 12.3885 14.0658 13.3124 13.9482 14.1855C13.7235 15.8545 12.34 17.1762 10.6328 17.2549C9.49969 17.307 8.34848 17.334 7.08301 17.334C5.81757 17.334 4.6663 17.307 3.5332 17.2549C1.82608 17.1762 0.443471 15.8544 0.21875 14.1855C0.101186 13.3123 0 12.3886 0 11.4375C2.29839e-05 10.4865 0.101184 9.56264 0.21875 8.68945C0.408969 7.2779 1.4279 6.11758 2.77051 5.74512V4.3125C2.77068 1.93092 4.70139 0 7.08301 0ZM7.08301 7.04199C5.83985 7.042 4.71201 7.06912 3.60254 7.12012C2.64439 7.16417 1.83656 7.91432 1.70508 8.88965C1.59029 9.74218 1.50002 10.5875 1.5 11.4375C1.5 12.2875 1.5903 13.1328 1.70508 13.9854C1.83644 14.9608 2.64429 15.7118 3.60254 15.7559C4.712 15.8069 5.83986 15.834 7.08301 15.834C8.32629 15.834 9.45488 15.8069 10.5645 15.7559C11.5224 15.7115 12.3296 14.9606 12.4609 13.9854C12.5757 13.1328 12.667 12.2875 12.667 11.4375C12.667 10.5875 12.5757 9.74216 12.4609 8.88965C12.3295 7.91456 11.5223 7.16447 10.5645 7.12012C9.45488 7.06911 8.32629 7.042 7.08301 7.04199ZM7.08301 9.89648C7.49722 9.89649 7.83301 10.2323 7.83301 10.6465V12.2295C7.83283 12.6436 7.49711 12.9795 7.08301 12.9795C6.6689 12.9795 6.33318 12.6436 6.33301 12.2295V10.6465C6.33301 10.2323 6.66879 9.89648 7.08301 9.89648ZM7.09375 9.17773H7.08301V9.16699H7.09375V9.17773ZM7.08301 1.5C5.52982 1.5 4.27068 2.75935 4.27051 4.3125V5.59082C5.16856 5.55854 6.09075 5.542 7.08301 5.54199C8.07541 5.542 8.99735 5.55853 9.89551 5.59082V4.3125C9.89533 2.75935 8.6362 1.5 7.08301 1.5Z"
        />
      </svg>
    </div>

    <script src="https://cdn.auth0.com/js/lock/14.2.3/lock.min.js"></script>

    <script>
      var config = JSON.parse(
        decodeURIComponent(escape(window.atob("@@config@@"))),
      );
      config.extraParams = config.extraParams || {};
      var connection = config.connection;
      var prompt = config.prompt;
      var languageDictionary;
      var language;

      if (config.dict && config.dict.signin && config.dict.signin.title) {
        languageDictionary = { title: config.dict.signin.title };
      } else if (typeof config.dict === "string") {
        language = config.dict;
      }

      var urlParams = new URLSearchParams(window.location.search);

      var isSignUp = urlParams.get("screen") === "signup";

      var initialScreen = isSignUp ? "signUp" : "login";

        auth: {
          redirectUrl: config.callbackURL,
          responseType:
            (config.internalOptions || {}).response_type ||
            (config.callbackOnLocationHash ? "token" : "code"),
          params: config.internalOptions,
        },
        configurationBaseUrl: config.clientConfigurationBaseUrl,
        overrides: {
          __tenant: config.auth0Tenant,
          __token_issuer: config.authorizationServer.issuer,
        },
        assetsUrl: config.assetsUrl,
        allowedConnections: connection ? [connection] : null,
        rememberLastLogin: !prompt,

        allowLogin: true,
        allowSignUp: true,
        loginAfterSignup: false,

        theme: {
          logo: "https://daeda-panel-frontend-ten.vercel.app/daedalus_logo.svg",

          passwordInputHeader: "PASSWORD",
          forgotPasswordAction: "Forgot password?",
          forgotPasswordTitle: "Forgot your password?",
          forgotPasswordInstructions:
            "We'll send you an email to reset your password if the email is registered in the system. If you still do not have an account in the system please contact an admin or support.",
          forgotPasswordSubmitLabel: "Send email",
          loginSubmitLabel: "Sign in",
          blankErrorHint: "Cannot be blank",
        },

        container: "lock-container",

        closable: false,
      });

      lock.show();

      var justSignedUp = false;
      var signupSuccessful = false;
      var lockAfterSignup = false;
      var lockContainer = document.getElementById("lock-container");
      var submitButton;

      lock.on("signup submit", function () {
        justSignedUp = true;
        signupSuccessful = false;
      });

      lock.on("signup success", function (profile) {
        console.log("Signup successful:", profile);
        justSignedUp = true;
        signupSuccessful = true;

        if (window.location.search.includes("screen=signup")) {
          var newUrl =
            window.location.pathname +
            window.location.search.replace(/[?&]screen=signup/, "");
          if (newUrl.endsWith("?")) {
            newUrl = newUrl.slice(0, -1);
          }
          window.history.replaceState({}, "", newUrl);
        }

        var successMessage = document.createElement("div");
        successMessage.className = "signup-success-message";
        successMessage.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 0C15.5228 0 20 4.47715 20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0ZM10 2C5.58172 2 2 5.58172 2 10C2 14.4183 5.58172 18 10 18C14.4183 18 18 14.4183 18 10C18 5.58172 14.4183 2 10 2ZM13.5 6.5L14.5 7.5L9 13L5.5 9.5L6.5 8.5L9 11L13.5 6.5Z" fill="white"/>
          </svg>
          Your account has been created successfully. Please log in with your credentials.
        `;

        var headerForm = document.querySelector(".header_form");
        if (headerForm) {
          headerForm.insertAdjacentElement("afterend", successMessage);
        }

        setTimeout(function () {
          justSignedUp = false;
          signupSuccessful = false;
          lockAfterSignup = true;

          if (successMessage) {
            successMessage.style.transition = "opacity 300ms ease-out";
            successMessage.style.opacity = "0";

            setTimeout(function () {
              if (successMessage && successMessage.parentNode) {
                successMessage.remove();
              }
            }, 300);
          }

          var clickAttempts = [400, 800, 1200, 1600, 2000];

          clickAttempts.forEach(function (delay) {
            setTimeout(function () {
              var currentTab = document.querySelector(
                ".auth0-lock-tabs-current",
              );
              if (currentTab) {
                var tabText = currentTab.textContent || currentTab.innerText;
                if (tabText && !tabText.includes("Log In")) {
                  var loginTab = document.querySelector(
                    ".auth0-lock-tabs li:not(.auth0-lock-tabs-current) a",
                  );
                  if (loginTab) {
                    console.log("Clicking login tab at " + delay + "ms");
                    loginTab.click();
                  }
                }
              }
            }, delay);
          });

          setTimeout(function () {
            lockAfterSignup = false;
          }, 3000);
        }, 6000);
      });

      lock.on("signup error", function (error) {
        console.log("Signup error:", error);
        justSignedUp = false;
        signupSuccessful = false;
        submitButton.disabled = false;
      });

      lock.on("unrecoverable_error", function (error) {
        console.log("Unrecoverable error (suppressed):", error);
      });

      const passwordPolicy = {
        length: {
          minLength: 8,
        },

        containsAtLeast: {
          atLeast: 3,

          expressions: [
            {
              name: "upperCase",

              explain() {
                return {
                  message: "upper case letters (A-Z)",
                  code: "upperCase",
                };
              },

              test(value) {
                return /[A-Z]/.test(value);
              },
            },

            {
              name: "lowerCase",

              explain() {
                return {
                  message: "lower case letters (a-z)",
                  code: "lowerCase",
                };
              },

              test(value) {
                return /[a-z]/.test(value);
              },
            },

            {
              name: "numbers",

              explain() {
                return {
                  message: "numbers (i.e. 0-9)",
                  code: "numbers",
                };
              },

              test(value) {
                return /\d/.test(value);
              },
            },

            {
              name: "specialCharacters",

              explain() {
                return {
                  message: "special characters (e.g. !@#$%^&*)",
                  code: "specialCharacters",
                };
              },

              test(value) {
                return /[!@#$%^&*(),.?":{}|<>_\-\\[\]\/+=~`]/.test(value);
              },
            },
          ],
        },
      };

      function attachPasswordValidation() {
        const policy = passwordPolicy;
        if (!policy || !policy.containsAtLeast) return;

        const expressions = policy.containsAtLeast.expressions || [];

        const passwordInput = document.querySelector('input[name="password"]');

        if (!passwordInput) return;

        passwordInput.addEventListener("input", () => {
          const value = passwordInput.value;

          if (policy?.length?.minLength) {
            document
              .getElementById("minLength")
              ?.classList.toggle(
                "valid",
                value.length >= policy.length.minLength,
              );
          }
          let validCount = 0;
          expressions.forEach((exp) => {
            const ruleId = exp?.explain?.()?.code || exp?.name || "";
            if (!ruleId) return;

            const ruleElement = document.getElementById(ruleId);
            if (!ruleElement) return;

            const match = exp.test(value);
            ruleElement.classList.toggle("valid", match);
            if (match) validCount++;
          });
          document
            .getElementById("at-least-3-valid")
            ?.classList.toggle("valid", validCount >= 3);
        });
      }

        confirmPasswordInput.addEventListener("input", () => {

          const errorMessage = document.querySelector(
            ".confirm-password-error",

          if (passwordValue === confirmPasswordValue) {
            errorMessage.style.display = "none";
            submitButton.disabled = false;
          } else {
            errorMessage.style.display = "block";
            submitButton.disabled = true;
          }
        });

        // Add show/hide confirm password functionality
        const showPasswordIcon = document.querySelector(
          ".auth0-lock-show-password-2",
        );
        showPasswordIcon.addEventListener("click", (e) => {
          e.preventDefault();
          const passwordInput = document.querySelector(
            ".confirm-password-input",
          );
          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            showPasswordIcon.classList.add("active");
          } else {
            passwordInput.type = "password";
            showPasswordIcon.classList.remove("active");
          }
        });
      }

      function setLockReady() {
        document.documentElement.classList.add("lock-ready");

          if (hasTabs && hasForm) {
            setLockReady();
            obs.disconnect();
          }
        });

        obs.observe(container, { childList: true, subtree: true });
      })();

      // Sign up
      lock.on("signup ready", () => {
        submitButton.disabled = true;
        const inputElement = document.querySelector(

        const labelSubmit = document.querySelector(".auth0-label-submit");

        injectPasswordRulesAfterInput(inputElement);

        attachConfirmPassword();

      function replaceLockErrorsByField() {
        const emailError = document.getElementById(
          "auth0-lock-error-msg-email",
        );

        if (emailError) {
          const original = emailError.textContent.trim();

          if (original === "Cannot be blank") {
            emailError.textContent = "The email is required";
          }

          if (original === "Email is invalid") {
            emailError.textContent = "The email you entered is invalid";
          }
        }

        const passwordError = document.getElementById(
          "auth0-lock-error-msg-password",
        );

        if (passwordError) {
          const original = passwordError.textContent.trim();

          if (original === "Cannot be blank") {
            passwordError.textContent = "The password is required";
          }
        }
      }

      function updateHeaderFormText() {
        const header = document.querySelector(".header_form");

        if (!header) return;

        const title = header.querySelector("h1");
        const subtitle = header.querySelector(".subtitle");

        if (!title || !subtitle) return;

        const activeTab = document.querySelector(".auth0-lock-tabs-current");

        if (!activeTab) return;

        const tabText = activeTab.textContent.trim();

        if (tabText === "Log In") {
          title.textContent = "Log in to your account";
          subtitle.textContent = "Welcome back! Please enter your details";
        } else if (tabText === "Sign Up") {
          title.textContent = "Create a new account";
          subtitle.textContent = "Welcome! Please register your new account";
        }
      }

      function addCustomLabels() {
        var emailBlock = document.querySelector(
          "div.auth0-lock-input-block.auth0-lock-input-email",
        );

        if (emailBlock) {
          if (!emailBlock.querySelector(":scope > .auth0-lock-input-label")) {
            var emailLabel = document.createElement("div");
            emailLabel.className = "auth0-lock-input-label";
            emailLabel.textContent = "EMAIL ADDRESS";
            emailBlock.insertBefore(emailLabel, emailBlock.firstChild);
          }
        }

        var passwordBlock = document.querySelector(
          "div.auth0-lock-input-block.auth0-lock-input-password",
        );

        if (passwordBlock) {
          if (
            !passwordBlock.querySelector(":scope > .auth0-lock-input-label")
          ) {
            var passwordLabel = document.createElement("div");
            passwordLabel.className = "auth0-lock-input-label";
            passwordLabel.textContent = "PASSWORD";
            passwordBlock.insertBefore(passwordLabel, passwordBlock.firstChild);
          }
        }
      }

      function runLabelFixBurst() {
        addCustomLabels();
        replaceLockErrorsByField();
        updateHeaderFormText();
      }

      lock.on("show", () => {
        console.log("Lock shown, running label fix burst");
        if (!lockAfterSignup) {
          runLabelFixBurst();
        }
      });

      (function attachObserver() {
        var container = document.getElementById("lock-container");
        if (!container) return;

        var observer = new MutationObserver(function () {
          if (lockAfterSignup) return;

          addCustomLabels();
          replaceLockErrorsByField();
          updateHeaderFormText();
        });

        observer.observe(container, {
          childList: true,
          subtree: true,
        });

        runLabelFixBurst();
      })();

      let formSubmitted = false;

      document.addEventListener("click", function (e) {
        var target = e.target;
        var backBtn = target.closest("#forgot-password-back-btn");
        if (backBtn) {
          e.preventDefault();
          e.stopPropagation();
          console.log("Back button clicked via delegation");

          var forgotHeader = document.querySelector(
            ".header-form-forgot-password",
          );
          if (forgotHeader) {
            forgotHeader.style.display = "none";
          }

          var loginHeader = document.querySelector(".header_form");
          if (!loginHeader) {
            var loginForm = document.querySelector(".login_form");
            if (loginForm) {
              var newHeader = document.createElement("div");
              newHeader.className = "header_form";
              newHeader.innerHTML =
                '<h1>Log in to your account</h1><p class="subtitle">Welcome back! Please enter your details</p>';
              loginForm.insertBefore(newHeader, loginForm.firstChild);
            }
          } else {
            loginHeader.style.display = "block";
          }

          lock.hide();
          setTimeout(function () {
            lock.show({ initialScreen: "login" });
          }, 100);
        }
      });

      lock.on("forgot_password ready", () => {
        setTimeout(function () {
          const formHeader = document.querySelector(".header_form");
          const formHeaderForgotPassword = document.querySelector(
            ".header-form-forgot-password",
          );
          const paragraph = document.querySelector(
            ".auth0-lock-form > div > p",
          );
          const input = document.querySelector(
            ".auth0-lock-input-block.auth0-lock-input-email",
          );
          const switchEl = document.getElementById("auth-switch");
          const btn = document.querySelector(
            ".auth0-lock.auth0-lock .auth0-lock-submit span",
          );
          if (btn) {
            btn.textContent = "Send Email";
            btn.style.textTransform = "none";
          }

          const spanText = document.querySelector(
            ".auth0-lock-form > div > p > span",
          );
          if (spanText) {
            spanText.style.display = "none";
          }

          if (formHeaderForgotPassword) {
            formHeaderForgotPassword.style.display = "block";
          }

          if (switchEl) {
            switchEl.remove();
          }

          if (formHeader) {
            formHeader.remove();
          }
          if (paragraph) {
            paragraph.remove();
          }
          if (input) {
            input.style.marginBottom = "32px";
            input.classList.add("forgot-password-input-email");
          }
          var backBtn = document.getElementById("forgot-password-back-btn");
          if (backBtn) {
            console.log("Back button found, attaching direct handler");
            backBtn.onclick = function (e) {
              e.preventDefault();
              e.stopPropagation();
              console.log("Back button clicked (direct handler)");

              var forgotHeader = document.querySelector(
                ".header-form-forgot-password",
              );
              if (forgotHeader) {
                forgotHeader.style.display = "none";
              }

              var loginHeader = document.querySelector(".header_form");
              if (!loginHeader) {
                var loginForm = document.querySelector(".login_form");
                if (loginForm) {
                  var newHeader = document.createElement("div");
                  newHeader.className = "header_form";
                  newHeader.innerHTML =
                    '<h1>Log in to your account</h1><p class="subtitle">Welcome back! Please enter your details</p>';
                  loginForm.insertBefore(newHeader, loginForm.firstChild);
                }
              } else {
                loginHeader.style.display = "block";
              }

              lock.hide();
              setTimeout(function () {
                lock.show({ initialScreen: "login" });
              }, 100);

              return false;
            };
          } else {
            console.log("Back button NOT found");
          }
        }, 200);
      });

      lock.on("forgot_password submit", () => {
        formSubmitted = true;
      });

      const observer = new MutationObserver(() => {
        const confirmation = document.querySelector(
          ".auth0-global-message.auth0-global-message-success",
        );

        if (confirmation && formSubmitted) {
          const formBox = document.querySelector(".lock-container-panel");
          const backBtn = document.getElementById("forgot-password-back-btn");
          if (backBtn) {
            backBtn.style.display = "none";
          }

          if (formBox) formBox.classList.add("forgot-password-success");
          const redirectContainer = document.querySelector(
            ".password-set-successfully-bottom",
          );
          if (redirectContainer) redirectContainer.style.display = "flex";

          const redirectLink = document.getElementById("go-back-login-btn");
          if (redirectLink) {
            const link = config.callbackURL || "/";
            const cleanLink = link.replace("/auth/callback", "");
            redirectLink.style.display = "flex";
            redirectLink.href = cleanLink;
          }
          const formHeader = document.querySelector(
            ".header-form-forgot-password",
          );
          if (formHeader) {
            const title = formHeader.querySelector("h1");
            const subtitle = formHeader.querySelector(".subtitle");
            if (title) title.textContent = "We’ve sent you an email";
            if (subtitle)
              subtitle.textContent =
                "Check your inbox for password reset instructions.";
          }

          observer.disconnect();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
